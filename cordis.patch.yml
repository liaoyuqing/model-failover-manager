# model-failover-manager bundle patch.
#
# `name` must resolve to this package's own name, since the Loader imports the
# row by that specifier after `dsh plugin add` installs the package.
#
# Optional row config (all keys omitted here on purpose — the plugin's defaults
# work with no configuration):
#   dataDir: where groups/bindings/failure state is stored
#            (default: $DSH_HOME/model-failover-manager)
#   ofmHandoffExcludeProviders: providers whose failures must skip the
#            dsh-our-free-model account handoff and go straight to group
#            routing (default: [codearts], which dsh-codearts serves with its
#            own account pool)
#   compactionGuard: enable the billion-context compression guard (default:
#            true). When billion-context is the only compressor, providers the
#            proxy cannot see are ranked last so sessions keep their compaction.
#   uncompressedProviders: providers whose model endpoint is not on
#            billion-context's endpoint whitelist, so their traffic is sent
#            uncompressed (default: [qoder, qodercn], which post to a
#            WASM-encrypted path bili cannot parse)
#   qoderShim: route qoder/qodercn through the loopback compression shim
#            (default: false). The request leaves as plaintext OpenAI JSON so
#            billion-context compacts it, then the shim re-encrypts it with the
#            original WASM codec before the upstream call. Needs a hook line in
#            dsh-our-free-model's pack.js, which the plugin repairs if an
#            upgrade drops it.
#   qoderShimPort: loopback port for that shim (default: 47001, 127.0.0.1 only)
#   qoderShimWasmPath: explicit path to qoder-wasm.js when auto-detection under
#            $DSH_HOME/profiles/<name>/node_modules fails
#   defaultConcurrency: factory value of the concurrency cap used by models
#            that do not set one in model-concurrency.json (default: 0,
#            unlimited). The effective value can be changed from the dashboard
#            header and is stored in settings.json; clearing the override falls
#            back here. The cap is keyed by model rather than stored on a group
#            entry, because one model reached through several groups shares the
#            same upstream accounts.
#   concurrencyQueueTimeoutMs: how long routing waits for a slot when the whole
#            group is full and there is nowhere to switch. The gate itself never
#            queues: a request that cannot get a slot fails as CAPACITY_TIMEOUT
#            right away and routing moves the session to a free model in the
#            group. (default: 180000; 0 waits forever)
#   capacityCooldownMs: how long a model that hit a capacity failure is skipped
#            while the router picks candidates (default: 30000). Capacity
#            failures deliberately do not mark a model failed for the day.
#   capacitySwitchRevertMs: minimum time a session stays on the substitute model
#            before it may switch back to the original one (default: 30000), so
#            two busy models cannot bounce a session back and forth.
#   lanGateway: factory state of the LAN forwarding switch (default: false);
#            the live value is settings.json's lanEnabled, null meaning "follow
#            this". Listening on 0.0.0.0 is what exposes the machine, so it is
#            off until the user turns it on.
#   lanGatewayPort: LAN forwarding port (default: 47021; the UI override lives
#            in settings.json as lanPort). Same block as the qoder shim (47001)
#            and the trae shim (47011).
#   lanSystemAsUserProviders: providers whose system prompt is sent as the
#            first user message rather than the first system message when the
#            LAN gateway forwards a request (default: [qoder, qodercn]). Their
#            adapters only forward options.system into a top-level systemText
#            payload field that the upstream ignores, so an instruction stated
#            there is dropped; the same text in a conversation turn is obeyed.
#            Bare ids: candidates are matched after stripping the plugin prefix.

# Installing this bundle also installs dsh-llm-error-retry (declared under
# "dependencies") and mounts its row here, so one install gives both plugins.
# The row reuses the id dsh-llm-error-retry's own bundle patch uses: loader
# entries are kept by id, so a profile that also selected that bundle composes
# two rows with this id and the loader mounts one entry from the later row —
# never two retry instances that would each retry the same request.

# Optional, and deliberately NOT enabled here: the six free-channel plugins all
# register providers whose ids collide (qoder, qodercn, trae, cline, loomy,
# raccoon, minimax, zcode, gemini, codearts, workbuddy, ...) and the host keeps
# one adapter per provider, so whichever side registers last is either rejected
# with DUPLICATE_ADAPTER or silently swallowed.
#
# The fix is a per-plugin provider prefix — ofm- (dsh-our-free-model), ca-
# (dsh-codearts), cw- (dsh-connect-workbuddy), ct- (dsh-connect-trae), cq-
# (@dmh2002/dsh-connect-qoder), caa- (dsh-providers-hub) — applied on the real
# registry side by an llm facade inside a cordis isolate realm. It must be
# deployed in $DSH_HOME's own cordis.patch.yml (the home layer applies last, so
# it can isolate an entry this bundle does not own): one facade row plus one
# isolate row per channel (22 rows in all — codearts-auth needs a wider isolate,
# see below). See "门面部署" in README.md.
#
# The prefix alone does not make dsh-providers-hub coexist with dsh-our-free-model:
# both also register the SAME cordis services (lobsteraiAuth, qoderAuth,
# qodercnAuth, traeAuth, clineAuth, loomyAuth, raccoonAuth, minimaxAuth,
# zcodeAuth, geminiAuth, accountPool) via super(ctx, `${product.id}Auth`), and
# cordis provide throws on a duplicate service name, aborting the later plugin's
# whole apply — its channel adapters never register and it vanishes from the
# model tabs. codearts-auth's isolate therefore also lists those 11 names under
# the same label. Recheck them after either side upgrades.
#
# Two rows must always share a label, and a facade entry must live in a package
# directory with NO dsh.client declaration: client-modules merges bundles by
# package name, so a second client bundle under the same name makes the host
# fail to boot (that is what broke DSH last time). Adding the rows here would
# point the facade at every profile — including ones without those channels —
# and would collide with a home patch that already inserts the same entry ids.
#
# This plugin needs none of that to work: it converts between bare ids and
# prefixed registry ids itself (provider-prefix.mjs), so a plugin without the
# facade keeps registering bare ids and both views may coexist.

- insert:
    - id: model-failover-manager
      name: 'model-failover-manager'
    - id: llm-error-retry
      name: 'dsh-llm-error-retry'
