# model-failover-manager bundle patch.
#
# 一行一个 Loader 条目。相对路径由 Profile 组装器锚定在本文件所在目录，
# 因此整包（含 compat/ 下的兼容插件）可以整体搬动或整体安装，运行时不需要
# 任何额外的 node_modules 解析。
#
# compat/ 下每个子目录都是一个独立包（各自有 package.json 与包名），不能合并进
# 本包：client-modules 按包名归并浏览器半边，同名的多个 active Loader 源会直接
# 抛 "resolves from multiple active Loader sources" 让宿主启动失败；而
# dsh-sidebar-scroller-compat / dsh-subagent-prune 自带 ./client，门面所在的
# model-failover-provider-prefix 则必须**没有** dsh.client 声明。
#
# 本包的 package.json 用 dependencies 的 file:./compat/<包名> 声明这些子包，
# 所以它们随本包一起安装、一起升级。
#
# 刻意**不**在这里插入 llm-error-retry 行：本机部署把该插件放在
# $DSH_HOME/plugins/llm-error-retry-ui/ 并由 $DSH_HOME/cordis.patch.yml 的
# id: llm-error-retry 持有。Loader 条目按 id 存放，两层各插一行同 id 会产生两个
# 实例、各自重试同一条请求。只装本包而不装 llm-error-retry 时，错误重试功能缺席
# 但不会报错。
#
# provider 前缀门面不在这里插入：它必须与「给某个渠道条目加 isolate」的那一行成对
# 出现，而 isolate 只能由最后一层（$DSH_HOME/cordis.patch.yml）施加到别的插件
# 拥有的条目上，因此四对门面/isolate 行留在 $DSH_HOME 层，name 指向
# ./plugins/model-failover-manager/compat/model-failover-provider-prefix/llm-prefix-facade.mjs。

- insert:
    - id: model-failover-manager
      name: ./host.mjs
    - id: connection-compat
      name: ./compat/dsh-connection-compat/host.v3.mjs
    - id: connection-admit-compat
      name: ./compat/dsh-connection-admit-compat/host.mjs
    - id: sidebar-scroller-compat
      name: ./compat/dsh-sidebar-scroller-compat/host.mjs
    - id: subagent-prune
      name: ./compat/dsh-subagent-prune/host.mjs
    - id: ofm-revive-compat
      name: ./compat/dsh-ofm-revive-compat/host.mjs
